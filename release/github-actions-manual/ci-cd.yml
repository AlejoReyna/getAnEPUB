name: CI y deploy a Vercel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_ADS_ENABLED: "false"

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar Astro y TypeScript
        run: npm run check

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Comprobar la compilación sin publicar
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: npm run setup && npm run build

      - name: Compilar y publicar en Vercel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?Configura VERCEL_TOKEN en GitHub Secrets}"
          : "${VERCEL_ORG_ID:?Configura VERCEL_ORG_ID en GitHub Secrets}"
          : "${VERCEL_PROJECT_ID:?Configura VERCEL_PROJECT_ID en GitHub Secrets}"
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deployment-url.txt
          cat deployment-url.txt >> "$GITHUB_STEP_SUMMARY"
